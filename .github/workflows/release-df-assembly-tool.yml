name: Release - DF Assembly
on:
  push:
    tags: ['df-assembly-tool/v*']
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      tag:
        description: '源码标签，例如 v0.1.12-rc.1'
        required: true
        type: string
      sha:
        description: '可选的完整源码提交 SHA，用于核对标签'
        type: string
permissions:
  contents: read
concurrency:
  group: release-df-assembly-tool-${{ github.event.client_payload.tag || inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  resolve:
    if: github.event_name != 'repository_dispatch' || github.event.client_payload.tool == 'df-assembly-tool'
    runs-on: ubuntu-latest
    outputs:
      tool: ${{ steps.source.outputs.tool }}
      version: ${{ steps.source.outputs.version }}
      source_repository: ${{ steps.source.outputs.source_repository }}
      source_tag: ${{ steps.source.outputs.source_tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Validate tool, tag and source commit
        id: source
        run: bun scripts/release-request.ts
        env:
          RELEASE_TOOL: df-assembly-tool
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
  build:
    needs: resolve
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ needs.resolve.outputs.source_repository }}
          ref: ${{ needs.resolve.outputs.source_sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            bridge/packages.lock.json
            tests/bridge/packages.lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: python
        with:
          python-version: '3.13'
      - name: Prepare pinned dependencies
        run: bun run setup --python "${{ steps.python.outputs.python-path }}"
      - name: Test, package, audit and smoke test
        env:
          BLENDER_PYTHON: ${{ steps.python.outputs.python-path }}
        run: bun run ci --version "$env:RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: df-assembly-tool-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/df-assembly-tool-${{ env.RELEASE_VERSION }}-windows-x64.zip
            dist/df-assembly-tool-${{ env.RELEASE_VERSION }}-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  publish:
    needs: [resolve, build]
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      tool: ${{ needs.resolve.outputs.tool }}
      source_tag: ${{ needs.resolve.outputs.source_tag }}
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      artifact: df-assembly-tool-${{ github.run_id }}-${{ github.run_attempt }}
