# Copy into the SOURCE repository as .github/workflows/public-release.yml.
# PUBLIC_RELEASE_TOKEN is limited to Loudomian/lo-tool-release (Contents: write).
name: Notify public release hub
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Request public build
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          SOURCE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh api --method POST repos/Loudomian/lo-tool-release/dispatches \
            -f event_type=release \
            -f 'client_payload[tool]=df-assembly-tool' \
            -f "client_payload[tag]=$SOURCE_TAG" \
            -f "client_payload[sha]=$SOURCE_SHA"
